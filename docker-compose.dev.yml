services:
  angular:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: angular-dev
    command: npm run start -- --host=0.0.0.0 --port=4200 --poll=2000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
