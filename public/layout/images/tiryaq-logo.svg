<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-label="Tiryaq Logo">
  <!-- Medical cross — vertical bar -->
  <rect x="20" y="8" width="20" height="64" rx="6" fill="#3EBE78"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="8"  y="20" width="44" height="20" rx="6" fill="#3EBE78"/>
  <!-- ECG / heartbeat line through the horizontal band -->
  <path d="M12,30 L20,30 L23,22 L27,38 L30,30 L48,30"
        stroke="white" stroke-width="2.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brand name -->
  <text x="68" y="54"
        font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="38" font-weight="700"
        fill="#1F2937"
        letter-spacing="-0.5">Tiryaq</text>
</svg>
