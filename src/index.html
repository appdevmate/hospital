<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Akwadona — Hospital Management Platform</title>
    <base href="/" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="preconnect" href="https://primefaces.org" />
    <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <link rel="stylesheet" type="text/css" href="/layout/styles/preloading.css" />
    <!-- Step 7i + Step 102 (Phase 1 of Hosted-UI replacement).
         Pre-Angular auth shim. Two goals:
           1. Rehydrate the access token from localStorage to sessionStorage
              so the session survives a browser close.
           2. If the user is NOT signed in and is not already at /login,
              redirect to /login BEFORE Angular boots. Saves ~300 ms vs
              waiting for the router guard to render the same page.
         Pre-Phase-1 step 2 redirected to Cognito Hosted UI - that path
         is dead now that we own the sign-in UX in-app.
    -->
    <script>
        (function () {
            try {
                // (1) Rehydrate token from persistent storage.
                var ls = window.localStorage.getItem('accessToken');
                if (ls && !window.sessionStorage.getItem('accessToken')) {
                    window.sessionStorage.setItem('accessToken', ls);
                }

                // Parse JWT exp claim.
                var token = window.sessionStorage.getItem('accessToken') || '';
                var hasFresh = false;
                if (token && token.split('.').length === 3) {
                    var part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    var pad = part + new Array((4 - (part.length % 4)) % 4 + 1).join('=');
                    try {
                        var exp = JSON.parse(atob(pad)).exp;
                        hasFresh = (typeof exp === 'number') && (exp * 1000 - Date.now() > 30000);
                    } catch (_) { hasFresh = false; }
                }

                // (2) Not signed in + not already on /login -> go to /login.
                var path = window.location.pathname || '/';
                var atLogin = path === '/login' || path.indexOf('/login') === 0;
                if (!hasFresh && !atLogin) {
                    // Preserve where the user was heading.
                    try { localStorage.setItem('returnUrl', path + window.location.search); } catch (_) {}
                    window.location.replace('/login');
                }
            } catch (_) { /* shim never blocks the app */ }
        })();
    </script>
</head>

<body>
    <app-root>
        <div class="splash-screen">
            <div class="splash-loader">
                <div class="splash-cube1"></div>
                <div class="splash-cube2"></div>
                <div class="splash-cube4"></div>
                <div class="splash-cube3"></div>
            </div>
        </div>
    </app-root>
</body>

</html>
